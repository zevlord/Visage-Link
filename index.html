<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Vtuber - VSeeFace Control Panel</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <script type="module" src="./js/main.js"></script>

    <!-- for the chat (can change the appearance later) -->
    <div class="chat-container">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button id="send-btn">Send ></button>

        <!--Voice mode trigger button-->
        <button id="voice-btn" style="margin-top: 10px; padding: 10px; font-weight: bold; border-radius: 4px; text-align: center; background-color: #333; color: #aaa; width: 100%; border: none; cursor: pointer; display: block;">
        Voice Mode
        </button>

        <!--Seamless loop toggle checkbox-->
        <div style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;">
            <input type="checkbox" id="seamless-mode-checkbox" style="cursor: pointer; width: auto;">
            <label for="seamless-mode-checkbox" style="color: #ccc; font-family: sans-serif; font-size: 12px; user-select: none; cursor: pointer;">Seamless Mode</label>
        </div>
        
        <p id="chat-log"></p>
    </div>

    <!-- On-screen debug logs overlay -->
    <div id="debug-console" class="debug-console">
        <div class="debug-title">Console Logs / Errors</div>
        <div id="debug-log-list" class="debug-log-list"></div>
    </div>

    <div class="control-container">
        <button id="btn-happy">Smile (Happy)</button>
        <button id="btn-angry">Angry</button>
        <button id="btn-blink">Blink</button>
        <button id="btn-talk">Say "Ah"</button>
        <button id="btn-reset">Reset Face</button>
    </div>
</body>
</html>
